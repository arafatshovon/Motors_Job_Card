services:
  motors_job_card:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "motors-job-card"
    command: "python manage.py runserver 0.0.0.0:${PORT:-9003}"
    ports:
      - "${PORT:-9003}:${PORT:-9003}"
    restart: unless-stopped
    volumes:
      - ./app/cluster_data:/app/cluster_data
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.10'
    #       memory: 250M
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:9001"]
    #   interval: 2m30s
    #   timeout: 30s
    #   retries: 5
    #   start_period: 30s

  gradio_panel:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    container_name: "motors-gradio-panel"
    ports:
      - "${GRADIO_PORT:-9002}:9002"
    restart: unless-stopped
    volumes:
      - ./app/cluster_data:/app/cluster_data
    depends_on:
      - motors_job_card
    environment:
      - API_HOST=motors-job-card
      - API_PORT=${PORT:-9003}
